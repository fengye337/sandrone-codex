name: Build and publish release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test shared Windows and Mac code
        shell: pwsh
        run: |
          node --test (Get-ChildItem tests/*.test.mjs | ForEach-Object FullName)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build release assets
        shell: powershell
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Run against a vX.Y.Z tag.' }
          ./tools/build-release.ps1 -Version $version
      - name: Publish assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $assets = @(Get-ChildItem "dist/release-$version/*.zip", "dist/release-$version/SHA256SUMS.txt" | ForEach-Object FullName)
          gh release create '${{ github.ref_name }}' @assets --title "Sandrone Codex $version" --notes-file docs/RELEASE-0.7.0.md --latest
